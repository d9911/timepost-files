  /api/v1/media/upload/complete:
    post:
      description: >-
        Повтор после успешного завершения возвращает тот же файл. Проверяются серверные размеры/ETag всех частей,
        metadata и фактический формат (JPEG/PNG/WebP, MP4 H.264/AAC, WebM VP8/VP9). Проверка потока через локальный
        временный файл ограничена 20 минутами, одновременно максимум две проверки на процесс. SHA-256 и постоянный
        object_key сохраняются в БД; presigned URL в БД не сохраняется.
      operationId: completeMediaUpload
      requestBody:
        content:
          application/json:
            schema:
              properties:
                parts:
                  items:
                    properties:
                      etag:
                        maxLength: 200
                        type: string
                      partNumber:
                        maximum: 10000
                        minimum: 1
                        type: integer
                    required:
                      - partNumber
                      - etag
                    type: object
                  maxItems: 10000
                  type: array
                uploadId:
                  format: uuid
                  type: string
              required:
                - uploadId
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                  success:
                    enum:
                      - true
                    type: boolean
                required:
                  - success
                  - data
                type: object
          description: Результат
          headers:
            Server-Timing:
              description: Время обработки API до отправки ответа
              schema:
                example: app;dur=12.30
                type: string
            X-Request-Id:
              description: Проверенный идентификатор корреляции
