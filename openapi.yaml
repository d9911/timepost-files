  /api/v1/internal/file-references:
    post:
      description: >-
        Только Timepost: HS256 system JWT, serviceId=posts-service, tokenType=system,
        permissions=[files:references:write], настроенные SYSTEM_JWT issuer/audience. Замена идемпотентна; блокировки
        сериализуют привязку и удаление. cleanupRemoved=true удаляет только новые после миграции ранее привязанные файлы
        без оставшихся ссылок. Старые файлы требуют полного backfill. Освобождение выполнять после commit удаления
        поста; сбой сохранения безопасно удерживает файл до сверки.
      operationId: replaceFileReferences
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cleanupRemoved:
                  default: false
                  type: boolean
                fileIds:
                  items:
                    format: uuid
                    type: string
                  maxItems: 100
                  type: array
                projectId:
                  pattern: ^[0-9]+$
                  type: string
                referenceId:
                  pattern: ^[a-zA-Z0-9:_-]{1,160}$
                  type: string
              required:
                - projectId
                - referenceId
                - fileIds
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      referenceId:
