            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
      summary: Прочитать приватный файл
  /api/v1/files/{id}/deletion:
    get:
      description: >-
        Проверяется доступ к проекту. Доступно после окончания удаления; 404, если задания нет. Повторный DELETE
        владельцем перезапускает только failed-задание; running не сбрасывается.
      operationId: getFileDeletion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      attempts:
                        minimum: 0
                        type: integer
                      fileId:
                        format: uuid
                        type: string
                      maxAttempts:
                        enum:
                          - 10
                        type: integer
                      status:
                        enum:
                          - pending
                          - running
                          - done
                          - failed
                        type: string
                    required:
                      - fileId
                      - status
                      - attempts
                      - maxAttempts
                    type: object
                  success:
                    enum:
                      - true
                    type: boolean
                required:
                  - success
                  - data
                type: object
          description: Состояние и число попыток, без ответов и секретов провайдера.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
      summary: Прочитать состояние очереди удаления
  /api/v1/storage:
    get:
      description: >-
        Нужен пользовательский bearer или API key. OAuth, ключи, DB URL и системные JWT никогда не возвращаются.
        Настройка провайдера выполняется серверным окружением, не этим API.
      operationId: getStorageConfiguration
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      authMode:
                        enum:
                          - timepost
                          - api-key
                        type: string
                      deleteEnabled:
                        type: boolean
                      genericFiles:
                        type: boolean
                      maxBytes:
                        enum:
                          - 10485760
                        type: integer
                      maxVideoBytes:
                        enum:
                          - 104857600
                        type: integer
                      provider:
                        enum:
                          - yandex
