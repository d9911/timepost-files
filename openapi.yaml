  /api/v1/media/upload/init:
    post:
      description: >-
        Требуется доступ на запись в проект. Только Yandex Object Storage со статическими серверными ключами. Presigned
        URL — временное разрешение, секретный ключ браузеру не передаётся.
      operationId: initMediaUpload
      requestBody:
        content:
