components:
  schemas:
    FileError:
      properties:
        error:
          properties:
            code:
              enum:
                - INVALID_PROJECT
                - INVALID_FILE_ID
                - INVALID_FILE_NAME
                - INVALID_PAGINATION
                - DELETE_DISABLED
                - STORAGE_PROVIDER_MISMATCH
                - UNAUTHORIZED
                - PROJECT_FORBIDDEN
                - AUTH_DEPENDENCY_UNAVAILABLE
                - FILE_TOO_LARGE
                - INVALID_IMAGE
                - INVALID_VIDEO
                - VIDEO_PROCESSOR_UNAVAILABLE
                - FILE_NOT_FOUND
                - FILE_FORBIDDEN
                - FILE_DELETING
                - UPLOAD_BUSY
                - NOT_FOUND
                - FILES_UNAVAILABLE
                - STORAGE_NOT_CONFIGURED
                - STORAGE_OPERATION_PENDING
                - STORAGE_UNAVAILABLE
                - STORAGE_INVALID_RESPONSE
              type: string
            message:
              type: string
          required:
            - code
            - message
          type: object
        success:
          enum:
            - false
          type: boolean
      required:
        - success
        - error
      type: object
    StoredFile:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        durationSeconds:
          maximum: 3600
          minimum: 0
          type: number
        fileName:
          maxLength: 255
          type: string
        height:
          maximum: 4096
          minimum: 1
          nullable: true
          type: integer
        id:
          format: uuid
          type: string
        mediaFileId:
          format: uuid
          type: string
        mimeType:
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - video/mp4
            - video/webm
            - application/octet-stream
          type: string
        projectId:
          pattern: ^\d+$
          type: string
        sha256:
          pattern: ^[a-f0-9]{64}$
          type: string
        sizeBytes:
          maximum: 104857600
          minimum: 1
          type: integer
        storageProvider:
          enum:
            - yandex
            - simulator
            - s3
            - selectel
            - aws
            - yandex-object
          type: string
        url:
          description: Приватный путь через same-origin proxy; не внешняя публичная ссылка.
          type: string
        width:
          maximum: 4096
          minimum: 1
          nullable: true
          type: integer
      required:
        - id
        - mediaFileId
        - projectId
        - url
        - mimeType
        - width
        - height
        - sizeBytes
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: >-
    Приватные файлы проектов. Провайдеры: Яндекс Диск, Selectel S3, Amazon S3, Yandex Object Storage, совместимый S3
    endpoint и локальный симулятор; метаданные и очередь удаления — PostgreSQL. Авторизация: Timepost
    (Accounts/Projects) либо автономные bearer API keys. Удаление в Timepost требует учтённый файл без ссылок;
    автономное удаление доступно владельцу. Постоянных публичных ссылок нет; Yandex S3 поддерживает временные presigned
    PUT/GET и multipart. Swagger доступен только как локальный артефакт.
  title: Timepost Files API
  version: 0.3.0
openapi: 3.0.3
