      summary: Загрузить файл проекта
  /api/v1/files/{id}:
    delete:
      description: >-
        Требуется FILES_DELETE_ENABLED=true. В Timepost загрузивший пользователь должен иметь право записи; допускаются
        новые после миграции файлы без ссылок, включая ещё не привязанные загрузки. Файлы до миграции учёта защищены
        даже после регистрации до полной сверки старых ссылок. 202 означает очередь; файл перестаёт читаться сразу,
        worker удаляет байты и фиксирует deleted. Повтор допускается в deleting; после завершения 404. Worker повторяет
        сбои до 10 попыток; failed требует вмешательства оператора.
      operationId: deleteFile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      id:
                        format: uuid
                        type: string
                      status:
                        enum:
                          - deleting
                        type: string
                    required:
                      - id
                      - status
                    type: object
                  success:
                    enum:
                      - true
                    type: boolean
                required:
                  - success
                  - data
                type: object
          description: Удаление принято, байты ещё могут находиться у провайдера.
          headers:
            Server-Timing:
              description: Время обработки API до отправки ответа
