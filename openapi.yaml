          description: Ошибка проверки доступа, входных данных или зависимости
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '415':
          content:
