                mimeType:
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                    - video/mp4
                    - video/webm
                  type: string
                projectId:
                  pattern: ^[0-9]+$
                  type: string
                sizeBytes:
                  maximum: 10000000000
                  minimum: 1
                  type: integer
                socialNetwork:
