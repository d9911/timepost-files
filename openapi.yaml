          description: Ошибка проверки доступа, входных данных или зависимости
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
      summary: Получить метаданные доступного файла
  /api/v1/files/{id}/content:
    get:
      description: >-
        Требуется Bearer сессия и участие в проекте. Ответ не кэшируется. В браузере нужно авторизованно получить Blob;
        обычный img/video без сессии не работает. Видео выдаётся inline; Range/resumable не реализованы, клиент получает
        ограниченный Blob.
      operationId: getFileContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
            image/webp:
              schema:
                format: binary
                type: string
            video/mp4:
              schema:
                format: binary
                type: string
            video/webm:
              schema:
                format: binary
                type: string
          description: Файл
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
          description: Ошибка проверки доступа, входных данных или зависимости
        '403':
