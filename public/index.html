<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Files — хранилище</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Файловое хранилище</h1>
      <p>
        Ключ вводится только для текущей вкладки. Настройка провайдера выполняется на сервере в
        .env.
      </p>
      <form id="connect">
        <label>Ключ доступа<input id="key" type="password" autocomplete="off" required /></label
        ><label>Проект<input id="project" value="1" inputmode="numeric" required /></label
        ><button>Подключиться</button>
      </form>
      <p id="configuration" role="status"></p>
      <form id="upload">
        <label>Файл<input id="file" type="file" required /></label><button>Загрузить</button>
      </form>
      <p id="feedback" role="status"></p>
      <table>
        <thead>
          <tr>
            <th>Имя</th>
            <th>Размер</th>
            <th>Тип</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <button id="more" hidden>Загрузить ещё</button><button id="refresh">Обновить список</button>
    </main>
  </body>
</html>
